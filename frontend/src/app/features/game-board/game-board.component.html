<section class="game-board">
  <div class="game-board__meta">
    <span class="game-board__mode">Mode: {{ modeLabel }}</span>
    <span
      class="game-board__status"
      [class.game-board__status--won]="state.status === 'Won'"
      [class.game-board__status--draw]="state.status === 'Draw'"
    >
      {{ statusMessage }}
    </span>
  </div>

  <div class="game-board__grid" role="grid" aria-label="Tic Tac Toe board">
    <button
      *ngFor="let cell of state.board; let i = index"
      type="button"
      class="game-board__cell"
      [class.game-board__cell--x]="cell === 'X'"
      [class.game-board__cell--o]="cell === 'O'"
      [class.game-board__cell--winning]="isWinningCell(i)"
      [disabled]="!isCellClickable(i)"
      [attr.aria-label]="'Row ' + cellRow(i) + ', Column ' + cellColumn(i)"
      (click)="onCellClick(i)"
    >
      {{ cell }}
    </button>
  </div>

  <div class="game-board__actions">
    <button type="button" class="game-board__action" (click)="undo.emit()" [disabled]="!state.canUndo">
      Undo Last Move
    </button>
    <button type="button" class="game-board__action game-board__action--secondary" (click)="resetGame.emit()">
      Reset Game
    </button>
  </div>
</section>
